name: market

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'presets/**'
      - 'tools/market-index.mjs'
      - 'tools/lib/repo.mjs'
      - '.github/workflows/market.yml'
  workflow_dispatch:
    inputs:
      expected:
        description: '等待指定 npm 版本（可选 JSON 数组，每项为 name、version、tag）'
        type: string
        default: ''
  workflow_call:
    inputs:
      expected:
        type: string
        default: ''

permissions: {}

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate plugin index
        env:
          EXPECTED: ${{ inputs.expected }}
        run: node tools/market-index.mjs --out tmp/market --expected "$EXPECTED"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: tmp/market

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
