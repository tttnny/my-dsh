name: publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '包名、目录名或路径（逗号或空格分隔），留空自动挑还未发布的版本'
        default: ''
      dist_tag:
        description: 'npm dist-tag'
        default: latest
      dry_run:
        description: '演练安装、检查与打包'
        default: false
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Check release ref
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo '::error::正式发布只能选择 main 分支。其他分支可运行演练。'
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Plan
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          mkdir -p tmp
          args=(--packages "$PACKAGES" --json)
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          node tools/publish-plan.mjs "${args[@]}" > tmp/publish-plan.json
          echo "提交 $GITHUB_SHA · 标签 ${DIST_TAG:-latest} · 演练 $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          corepack enable
          node tools/install-dependencies.mjs

      - name: Check repository
        run: node tools/check.mjs

      - name: Pack and verify archives
        run: node tools/release-packages.mjs pack tmp/publish-plan.json tmp/release

      - name: Publish verified archives
        id: release
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: node tools/release-packages.mjs publish tmp/release

  market:
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.published != '' && needs.publish.outputs.published != '[]' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/market.yml
    with:
      expected: ${{ needs.publish.outputs.published }}
