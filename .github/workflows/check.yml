name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A missing base (first push or a force push) falls back to the full check.
          if [[ -n "$BASE_SHA" ]] && git diff --quiet --no-renames "$BASE_SHA" HEAD -- plugins/ presets/ tools/ .githooks/ .github/; then
            echo 'mode=ledger' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        if: steps.scope.outputs.mode == 'full'
        run: |
          corepack enable
          node tools/install-dependencies.mjs

      - name: Check repository
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          if [[ "$MODE" == ledger ]]; then
            node tools/check.mjs --ledger-only
          else
            node tools/check.mjs
          fi
