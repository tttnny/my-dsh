# @lynn123411/dsh-kimi-cu bundle patch
# 声明在 package.json 的 dsh.bundle.patch，`dsh plugin --profile web add` 后自动并入 profile 层栈。
#
# 五行都在根层：
#   - dsh-kimi-cu：本包自己。宿主半边（kimi_cu_status 工具 + 状态路由）与浏览器半边
#     （插件页状态卡）都挂在这一行；这一行不设平台守卫，别的平台上照常加载，卡片会说明
#     当前平台不受支持。
#   - mcp-kimi-cu-macos / mcp-kimi-cu-windows：KimiCU 的 MCP 连接。macOS 走 app 包内的
#     二进制（后台静默）；Windows 走 runtime 安装目录（前台真实输入）。两条行共用
#     serverName: kimi-cu，平台守卫保证同一时刻只有一条启用。
#   - skill-kimi-cu-macos / skill-kimi-cu-windows：随包技能，各扫自己的目录。
#
# KimiCU 在 macOS 与 Windows 是两条产品线：macOS 只有 app 包，Windows 只有独立 runtime，
# 所以路径、参数与技能内容都按平台分开。
- insert:
    # 本包自己的根层行：宿主半边 + 浏览器半边。
    - id: dsh-kimi-cu
      name: '@lynn123411/dsh-kimi-cu'

    # macOS：二进制在 app 包里，不是 PATH 上的命令。
    - id: mcp-kimi-cu-macos
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.platform !== 'darwin'
      config:
        serverName: kimi-cu
        transport: stdio
        command: /Applications/KimiCU.app/Contents/MacOS/kimi-cu
        args: [mcp, -s, user]
        # 连不上时报错并让这一行回滚，而不是静默少掉一整排工具。
        failOnStartupError: true
        # 内核默认 60 秒就取消一次调用；KimiCU 的 js 里可能跑长循环，
        # 留 5 分钟，避免把还在执行的 cell 当成失败。
        toolCallTimeoutMs: 300000

    # Windows：runtime 默认装在 %LOCALAPPDATA%\Kimi Computer Use\kimi-cu.exe；
    # KIMI_CU_WINDOWS_EXE 可覆盖。路径用字符串拼接而不是 path.join，避免在 macOS 上
    # 求值出 POSIX 分隔符。
    - id: mcp-kimi-cu-windows
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.platform !== 'win32'
      config:
        serverName: kimi-cu
        transport: stdio
        command: !!js process.env.KIMI_CU_WINDOWS_EXE || ((process.env.LOCALAPPDATA || '') + '\\Kimi Computer Use\\kimi-cu.exe')
        args: [mcp]
        failOnStartupError: true
        toolCallTimeoutMs: 300000

    # 技能 provider 的第二份：providerName 另取一个名字，includeDefaultRoots 关掉默认目录，
    # 只扫本包对应的那份技能。内核那条默认技能行照旧负责项目与用户技能目录。
    #
    # 路径必须写成包里解析出来的绝对路径：bundle patch 的 !!js 以 PROFILE 目录为 baseUrl。
    - id: skill-kimi-cu-macos
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: !!js process.platform !== 'darwin'
      config:
        providerName: kimi-cu
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@lynn123411/dsh-kimi-cu/package.json')), 'skills', 'macos')

    - id: skill-kimi-cu-windows
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: !!js process.platform !== 'win32'
      config:
        providerName: kimi-cu
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@lynn123411/dsh-kimi-cu/package.json')), 'skills', 'windows')
