e-block;flex:none;background:currentColor;border-radius:3px"></span><span data-fold-priority="3">交接</span></span><span class="dsws-split-div"></span><span class="dsws-split-part" data-core="handoff-open" style="color:#58a6ff"><span style="width:12px;height:12px;display:inline-block;flex:none;background:currentColor;border-radius:3px"></span></span></span><span class="dsws-seg" data-core="env" style="display:inline-flex;align-items:center;gap:4px;color:#4ade80"><span style="width:12px;height:12px;display:inline-block;flex:none;background:currentColor;border-radius:3px"></span><span data-fold-priority="8">环境</span><span class="dsws-num">10/10</span></span><span class="dsws-timebtn" data-core="refresh"><span style="width:11px;height:11px;display:inline-block;flex:none;background:currentColor;border-radius:3px"></span><span data-fold-priority="4">更新</span><span data-fold-priority="9"> 09-20 00:30</span></span><span style="position:relative;display:inline-flex" data-core="skill"><span style="width:20px;height:12px;display:inline-block;background:currentColor;border-radius:3px"></span></span></div></div></div><script>function pass(cap, t1, t2, items, items2, useStage2){

  for (var i=0;i<items.length;i++){ if (cap.scrollWidth <= cap.clientWidth+1) break; items[i].el.classList.add('dsws-folded'); void cap.offsetWidth; }

    for (var j=0;j<items2.length;j++){ if (cap.scrollWidth <= cap.clientWidth+1) break; items2[j].el.classList.add('dsws-folded'); void cap.offsetWidth; }
  }
}
function fold(cap, useStage2, useTight){
  var t1 = Array.prototype.slice.call(cap.querySelectorAll('[data-fold-priority]'));
  var t2 = Array.prototype.slice.call(cap.querySelectorAll('[data-fold2-priority]'));
  var items = t1.map(function(el){ return { el: el, p: Number(el.getAttribute('data-fold-priority')||99) }; }).sort(function(a,b){ return a.p-b.p; });
  var items2 = t2.map(function(el){ return { el: el, p: Number(el.getAttribute('data-fold2-priority')||99) }; }).sort(function(a,b){ return a.p-b.p; });
  cap.classList.remove('dsws-tight');
  void cap.offsetWidth;
  pass(cap, t1, t2, items, items2, useStage2);
  var tight = !!useTight && cap.scrollWidth > cap.clientWidth+1;
  if (tight){ cap.classList.add('dsws-tight'); void cap.offsetWidth; pass(cap, t1, t2, items, items2, useStage2); }
  return {
    cw: cap.clientWidth,
    sw: cap.scrollWidth,
    tight: tight,
    folded1: t1.filter(function(el){ return el.classList.contains('dsws-folded'); }).length,
    folded2: t2.filter(function(el){ return el.classList.contains('dsws-folded'); }).map(function(el){ return Number(el.getAttribute('data-fold2-priority')); }),
    coreFolded: Array.prototype.slice.call(cap.querySelectorAll('[data-core].dsws-folded')).length
  };
}

  var cap = c.querySelector('.dsws-capsule');
  return { w: Number(c.getAttribute('data-w')), s2: fold(cap, true, true), s2nt: fold(cap, true, false), s1: fold(cap, false, false) };
