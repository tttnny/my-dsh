# @lynn123411/dsh-browseros-neo bundle patch
# 声明在 package.json 的 dsh.bundle.patch，`dsh plugin add` 后自动并入 profile 层栈。
# 浏览器半区（lib/client.js）由 client-modules 依据 dsh.client 声明自动发现，无需在此声明。
# 注意：patch 层只认 id 定位覆盖或 insert 列表，裸插件条目会被「matches nothing」静默跳过。
- insert:
    - id: dsh-browseros-neo
      name: '@lynn123411/dsh-browseros-neo'
